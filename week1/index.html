<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Lunch Menu Generator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            width: 90%;
            max-width: 500px;
            padding: 30px;
            text-align: center;
        }
        
        h1 {
            color: #ff6b6b;
            margin-bottom: 20px;
            font-size: 2.2rem;
        }
        
        .description {
            color: #555;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .lunch-display {
            background-color: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            margin: 25px 0;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }
        
        .food-icon {
            font-size: 4rem;
            margin-bottom: 15px;
            color: #ff6b6b;
        }
        
        .food-name {
            font-size: 2rem;
            color: #333;
            font-weight: bold;
            margin: 10px 0;
        }
        
        .generate-btn {
            background-color: #ff6b6b;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
        }
        
        .generate-btn:hover {
            background-color: #ff5252;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.5);
        }
        
        .generate-btn:active {
            transform: translateY(0);
        }
        
        .footer {
            margin-top: 30px;
            color: #777;
            font-size: 0.9rem;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .food-name {
                font-size: 1.6rem;
            }
            
            .generate-btn {
                padding: 12px 30px;
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-utensils"></i> Random Lunch Generator</h1>
        <p class="description">Struggling to decide what to eat? Let us choose for you with just one click!</p>
        
        <div class="lunch-display">
            <div class="food-icon"><i class="fas fa-question"></i></div>
            <div class="food-name">What's for lunch?</div>
        </div>
        
        <button class="generate-btn" id="generateBtn">
            <i class="fas fa-random"></i> Generate Lunch!
        </button>
        
        <p class="footer">Click the button again if you can't decide!</p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const generateBtn = document.getElementById('generateBtn');
            const foodIcon = document.querySelector('.food-icon');
            const foodName = document.querySelector('.food-name');
            const lunchDisplay = document.querySelector('.lunch-display');
            
            // Array of lunch options with corresponding Font Awesome icons
            const lunchMenu = [
                { name: "Pizza", icon: "fas fa-pizza-slice" },
                { name: "Sushi", icon: "fas fa-fish" },
                { name: "Burger", icon: "fas fa-hamburger" },
                { name: "Salad", icon: "fas fa-leaf" },
                { name: "Tacos", icon: "fas fa-hotdog" },
                { name: "Ramen", icon: "fas fa-bowl-rice" },
                { name: "Sandwich", icon: "fas fa-bread-slice" },
                { name: "Pasta", icon: "fas fa-plate-wheat" },
                { name: "Curry", icon: "fas fa-pepper-hot" },
                { name: "Steak", icon: "fas fa-cow" },
                { name: "Soup", icon: "fas fa-bowl-food" },
                { name: "BBQ", icon: "fas fa-fire" }
            ];
            
            // ---- Weighted skip-sensing picker (v2) ----
            // Two mechanisms work together:
            //  (a) HARD NO-REPEAT: `lastIndex` (the currently displayed item) is
            //      excluded from drawNext's candidate set, so a rejected item can never
            //      be the very NEXT pick — regardless of weights.
            //  (b) WEIGHTS BIAS LONG-RUN FREQUENCY among the eligible items: a meal that
            //      is re-clicked after being displayed for >= DEMOTE_MIN_MS is treated
            //      as disliked and demoted (x WEIGHT_DEMOTE), floored at WEIGHT_FLOOR so
            //      it can never be starved out; every pick all other meals recover
            //      (x WEIGHT_RECOVER, capped at WEIGHT_MAX), which re-normalizes the
            //      distribution so a demotion fades instead of being permanent.
            // Skip sensing: a re-click while the item has been shown for < DEMOTE_MIN_MS
            // likely fired while the 500ms spinner still hid the item (such a click
            // lands <250ms after the reveal), so it carries no signal — no demotion.
            // (Moving a rejected item to the deck tail would be a NO-OP rotation — it
            // merely reorders the draw sequence; only the weight mechanism actually
            // changes long-run frequency.)
            const LUNCH_STATE_KEY = 'lunch-picker-state-v2';
            const DEMOTE_MIN_MS = 750;
            const WEIGHT_MAX = 1.0;
            const WEIGHT_FLOOR = 0.2;
            const WEIGHT_DEMOTE = 0.5;
            const WEIGHT_RECOVER = 1.04;

            function loadLunchState() {
                try {
                    const raw = localStorage.getItem(LUNCH_STATE_KEY);
                    if (!raw) return null;
                    const state = JSON.parse(raw);
                    // Guard: every meal must be present with a finite weight within
                    // [0, WEIGHT_MAX]; unknown meal names, missing keys, or invalid
                    // lastIndex/lastShownAt/count all force a fresh default state.
                    if (!state || typeof state !== 'object' || !state.weights || typeof state.weights !== 'object') return null;
                    for (const meal of lunchMenu) {
                        const w = state.weights[meal.name];
                        if (typeof w !== 'number' || Number.isNaN(w) || w < 0 || w > WEIGHT_MAX) return null;
                    }
                    if (Object.keys(state.weights).length !== lunchMenu.length) return null;
                    if (state.lastIndex !== null && (typeof state.lastIndex !== 'number' || !Number.isInteger(state.lastIndex) || state.lastIndex < 0 || state.lastIndex >= lunchMenu.length)) return null;
                    if (state.lastShownAt !== null && typeof state.lastShownAt !== 'number') return null;
                    if (typeof state.count !== 'number' || Number.isNaN(state.count)) return null;
                    return state;
                } catch (err) {
                    return null; // storage disabled or invalid data -> fresh defaults
                }
            }

            function saveLunchState(state) {
                try {
                    localStorage.setItem(LUNCH_STATE_KEY, JSON.stringify(state));
                } catch (err) { /* storage disabled (private mode etc.) -> per-session behaviour */ }
            }

            // Every pick, every meal's weight creeps back toward the cap, so a demotion
            // is temporary and the distribution re-normalizes over time.
            function recoverWeights(state) {
                for (const meal of lunchMenu) {
                    state.weights[meal.name] = Math.min(WEIGHT_MAX, state.weights[meal.name] * WEIGHT_RECOVER);
                }
            }

            // The item shown for >= DEMOTE_MIN_MS and then re-clicked is treated as
            // disliked: halve its weight, floored so it cannot starve out entirely.
            function demoteMeal(state, index) {
                const name = lunchMenu[index].name;
                state.weights[name] = Math.max(WEIGHT_FLOOR, state.weights[name] * WEIGHT_DEMOTE);
            }

            // Weighted proportional sampling WITHOUT replacement: pick i with
            // probability weights[name_i] / sum(weights over candidates). Candidates =
            // every index except the currently displayed one (lastIndex === null on the
            // first-ever pick -> all 12 meals are candidates). One pass: accumulate
            // with r = Math.random() * totalW and pick where the accumulator crosses r.
            function drawNext(state) {
                const candidates = [];
                let totalW = 0;
                for (let i = 0; i < lunchMenu.length; i++) {
                    if (i === state.lastIndex) continue;
                    candidates.push(i);
                    totalW += state.weights[lunchMenu[i].name];
                }
                let r = Math.random() * totalW;
                let selectedIndex = candidates[candidates.length - 1];
                for (const i of candidates) {
                    r -= state.weights[lunchMenu[i].name];
                    if (r < 0) { selectedIndex = i; break; }
                }
                state.lastIndex = selectedIndex;
                state.count += 1;
                return lunchMenu[selectedIndex];
            }

            // Restore or initialize: on first run (or any guard trip above) every meal
            // starts at weight 1.0 with no pick history.
            const defaultWeights = {};
            for (const meal of lunchMenu) defaultWeights[meal.name] = WEIGHT_MAX;
            const lunchState = loadLunchState() || { weights: defaultWeights, lastIndex: null, lastShownAt: null, count: 0 };
            
            // Function to generate random lunch
            function generateRandomLunch() {
                // Skip sensing: how long has the currently displayed meal been shown?
                // (null lastShownAt = first ever pick, nothing on screen -> no signal)
                const elapsed = lunchState.lastShownAt === null ? Infinity : Date.now() - lunchState.lastShownAt;

                // The item on screen for >= DEMOTE_MIN_MS got clicked again -> treat as
                // a dislike and demote it. A click < DEMOTE_MIN_MS likely fired while
                // the 500ms spinner still hid the item, so there is no signal — do not
                // demote.
                if (elapsed >= DEMOTE_MIN_MS && lunchState.lastIndex !== null) {
                    demoteMeal(lunchState, lunchState.lastIndex);
                }

                // Every pick, every meal recovers a little toward the 1.0 cap.
                recoverWeights(lunchState);

                // Remove fade-in class if it exists
                lunchDisplay.classList.remove('fade-in');

                // Get a weighted random lunch option (never the currently shown meal),
                // then persist immediately.
                const selectedLunch = drawNext(lunchState);
                saveLunchState(lunchState);

                // Briefly show loading state
                foodIcon.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
                foodName.textContent = "Thinking...";

                // After a short delay, show the selected lunch
                setTimeout(() => {
                    foodIcon.innerHTML = `<i class="${selectedLunch.icon}"></i>`;
                    foodName.textContent = selectedLunch.name;

                    // Add animation class
                    lunchDisplay.classList.add('fade-in');

                    // Record when this pick became visible, and persist, so a reload
                    // never loses the display timestamp the skip-sensing relies on.
                    lunchState.lastShownAt = Date.now();
                    saveLunchState(lunchState);
                }, 500);
            }
            
            // Add click event to button
            generateBtn.addEventListener('click', generateRandomLunch);
            
            // Generate a random lunch on page load
            generateRandomLunch();
        });
    </script>
</body>
</html>
